<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Notas para Karen."
    />
    <meta name="theme-color" content="#ece8df" />
    <title>Para Karen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Manrope:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="#inicio" aria-label="Ir al inicio">K<span>—</span></a>
      <nav aria-label="Navegación principal">
        <a href="#notas">Notas</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="inicio">
        <div class="hero-copy">
          <p class="eyebrow">NOTAS</p>
          <h1>Para<br /><em>Karen.</em></h1>
          <a class="text-link" href="#notas">Ver notas <span>↓</span></a>
        </div>

        <div class="hero-mark" aria-hidden="true">
          <span>K</span>
          <p>Archivo<br />2026</p>
        </div>
      </section>

      <section class="notes-section" id="notas">
        <div class="section-heading">
          <div>
            <p class="eyebrow">ARCHIVO</p>
            <h2>Notas.</h2>
          </div>
          <p id="note-count" class="note-count"></p>
        </div>

        <div id="featured-note" class="featured-note"></div>

        <div id="archive-header" class="archive-header">
          <p>Notas anteriores</p>
          <span>ORDENADAS DE LA MÁS RECIENTE</span>
        </div>
        <div id="notes-grid" class="notes-grid" aria-live="polite"></div>

        <div id="empty-state" class="empty-state" hidden>
          <p>Aún no hay notas.</p>
        </div>
      </section>

    </main>

    <script src="notes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
